  # ----------------------------------------------------------------
  # BRIGHT-BAND vertical structure — adds the relational features that flag
  # whether the column-max reflectivity is itself bright-band-contaminated
  # (bright_band_ref/drop/intensity + maxz_meltlayer_offset). Built on the
  # best-known pattern: blunt filter, weighted_mae, no sampler, raw mm-space,
  # wide. The two configs differ only in use_feature_masks. Directly comparable
  # to the prior dpvertlowmelt_wide_featmask run (same set + brightband).
  # ----------------------------------------------------------------

  # ── A) Full feature set + bright band, WITH feature masks (DONE) ──
  # - name: wmae_nolog_bluntfilter_nosampler_dpvertlowmeltbb_wide_featmask
  #   model_type: unet
  #   filter_mode: blunt
  #   features: [dualpol, vertical, lowlevel, meltinglayer, brightband]
  #   loss: weighted_mae
  #   log_target: false
  #   width: wide
  #   use_feature_masks: true

  # ── B) Full feature set + bright band, NO feature masks (DONE) ──
  # - name: wmae_nolog_bluntfilter_nosampler_dpvertlowmeltbb_wide_nomask
  #   model_type: unet
  #   filter_mode: blunt
  #   features: [dualpol, vertical, lowlevel, meltinglayer, brightband]
  #   loss: weighted_mae
  #   log_target: false
  #   width: wide
  #   use_feature_masks: false

  # ----------------------------------------------------------------
  # LOSS / SAMPLER — attack the heavy-rain under-bias. All hold the new best
  # feature baseline fixed (bright-band feature set, featmask, blunt, nolog,
  # wide) and vary only the loss/sampler so the effect is isolated.
  #   asym_mae / asym_huber penalize underprediction (tgt>pred) by under_weight,
  #   shifting the model to a higher CONDITIONAL quantile (lifts heavy rain
  #   without globally inflating dry/light cases the way the sampler did).
  # ----------------------------------------------------------------

  # ── 1) Asymmetric MAE (≈0.67 quantile), no sampler ──
  # - name: asymmae_nolog_bluntfilter_nosampler_dpvertlowmeltbb_wide_featmask
