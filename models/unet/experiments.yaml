# Systematic feature experiments for U-Net precipitation models
# Run with: python -m models.run_experiments models/unet/experiments.yaml
# Dry run:  python -m models.run_experiments models/unet/experiments.yaml --dry-run
# Subset:   python -m models.run_experiments models/unet/experiments.yaml --only unet_dualpol_raw

base:
  pickle: dataset/outputs/3d/radar_gauge_dataset_vertical_9500.pkl
  dem: dem/preserve_dem_10m_utm.tif
  patience: 20
  epochs: 100
  batch_size: 32
  lr: 5.0e-5
  base_filters: 64
  no_sampler: true
  # n_encoder_blocks: auto-selected from patch size if omitted
  # (patch <=5 -> 1 for unet/2 for stack, patch <=9 -> 2/3, else 3/4)

